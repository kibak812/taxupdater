<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설정 - 예규판례 모니터링</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/dashboard.css?v=redesign-20260528">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23667085'><path d='M12 15a3 3 0 100-6 3 3 0 000 6z'/><path d='M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z'/></svg>">
    <link rel="stylesheet" href="/static/css/settings.css?v=redesign-20260528">
</head>
<body class="dashboard-body settings-body">
    <!-- Header -->
    <header class="dashboard-header">
        <div class="container">
            <div class="header-content">
                <div class="header-left">
                    <div class="header-logo">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1>설정</h1>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-actions">
                        <button class="btn btn-outline" onclick="window.location.href='/dashboard'">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            대시보드로 돌아가기
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <div class="container">
            <!-- Success Message -->
            <div id="successMessage" class="success-message" hidden>
                설정이 성공적으로 저장되었습니다!
            </div>

            <!-- Operations Summary -->
            <section class="settings-section operations-console">
                <div class="section-header compact">
                    <div>
                        <h3>운영 요약</h3>
                    </div>
                    <div class="section-actions">
                        <button class="btn btn-success btn-sm" id="instantCrawlBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            전체 즉시 탐색
                        </button>
                        <button class="btn btn-primary btn-sm" id="refreshUpdatesBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            새로고침
                        </button>
                    </div>
                </div>

                <div class="operations-grid">
                    <div class="operation-card is-primary">
                        <div class="operation-label">스케줄러</div>
                        <div class="operation-value with-indicator">
                            <span class="status-indicator" id="schedulerStatusIndicator"></span>
                            <span id="schedulerStatusText">로딩 중...</span>
                        </div>
                        <button class="btn btn-primary btn-sm" id="toggleSchedulerBtn" disabled>로딩 중...</button>
                    </div>
                    <div class="operation-card">
                        <div class="operation-label">활성 소스</div>
                        <div class="operation-value" id="activeSourcesCount">-</div>
                        <div class="operation-meta">자동 모니터링 대상</div>
                    </div>
                    <div class="operation-card">
                        <div class="operation-label">최근 실행</div>
                        <div class="operation-value" id="latestRunStatus">이력 없음</div>
                        <div class="operation-meta" id="latestRunMeta">-</div>
                    </div>
                    <div class="operation-card">
                        <div class="operation-label">다음 실행</div>
                        <div class="operation-value" id="nextRunSummary">-</div>
                        <div class="operation-meta">가장 빠른 예정 작업</div>
                    </div>
                </div>
            </section>

            <!-- Site-specific Settings -->
            <section class="settings-section">
                <div class="section-header compact">
                    <div>
                        <h3>소스별 모니터링</h3>
                    </div>
                </div>

                <div class="source-monitor-grid" id="siteList">
                    <!-- Source tiles will be populated dynamically -->
                </div>
            </section>

            <!-- Crawling Configuration -->
            <section class="settings-section">
                <div class="section-header compact">
                    <div>
                        <h3>크롤링 설정</h3>
                    </div>
                    <div class="section-actions">
                        <button class="btn btn-outline btn-sm" id="resetBtn">기본값</button>
                        <button class="btn btn-primary btn-sm" id="saveBtn">설정 저장</button>
                    </div>
                </div>
                
                <div class="settings-grid settings-grid-compact">
                    <div class="settings-field">
                        <label class="form-label" for="defaultInterval">기본 크롤링 주기</label>
                        <div class="input-group">
                            <input type="number" id="defaultInterval" class="form-input" value="6" min="1" max="168">
                            <span class="input-unit">시간</span>
                        </div>
                    </div>

                    <div class="settings-field">
                        <label class="form-label" for="notificationThreshold">알림 임계치</label>
                        <div class="input-group">
                            <input type="number" id="notificationThreshold" class="form-input" value="1" min="1" max="100">
                            <span class="input-unit">신규 항목</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Notification Settings -->
            <section class="settings-section">
                <h3>알림 설정</h3>
                
                <div class="settings-list">
                    <div class="settings-toggle-row">
                        <div class="settings-row-main">
                            <div class="settings-row-copy">
                                <div class="settings-row-title">브라우저 푸시 알림</div>
                                <div class="settings-row-description">
                                    권한 상태: <span id="browserNotificationStatus" class="notification-status">확인 중...</span>
                                </div>
                            </div>
                        </div>
                        <div class="settings-row-actions">
                            <button id="requestBrowserNotificationBtn" class="btn btn-primary btn-sm" hidden>권한 요청</button>
                            <label class="toggle-switch">
                                <input type="checkbox" class="toggle-input" id="browserNotificationToggle">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="settings-toggle-row">
                        <div class="settings-row-main">
                            <div class="settings-row-copy">
                                <div class="settings-row-title">ntfy 알림</div>
                                <div class="settings-row-description" id="ntfySummaryStatus">환경 변수 설정을 확인 중입니다</div>
                            </div>
                        </div>
                    </div>

                    <details class="settings-details" id="ntfySettingsDetails">
                        <summary>ntfy 구성 상태</summary>
                        <div class="settings-grid settings-grid-compact">
                            <div class="settings-field">
                                <label class="form-label">토픽</label>
                                <div class="readonly-value" id="ntfyTopicValue">-</div>
                            </div>
                            <div class="settings-field">
                                <label class="form-label">서버</label>
                                <div class="readonly-value" id="ntfyServerValue">-</div>
                            </div>
                            <div class="settings-field">
                                <label class="form-label">요약 개수</label>
                                <div class="readonly-value" id="ntfyItemLimitValue">-</div>
                            </div>
                            <div class="settings-field">
                                <label class="form-label">클릭 링크</label>
                                <div class="readonly-value" id="ntfyDashboardValue">-</div>
                            </div>
                        </div>
                    </details>
                </div>
            </section>

            <!-- Advanced Settings -->
            <section class="settings-section">
                <details class="settings-details">
                    <summary>고급 설정 및 관리</summary>
                    <div class="advanced-grid">
                        <div class="advanced-panel">
                            <h4>크롤링 고급값</h4>
                            <div class="settings-form-row">
                                <div class="settings-field">
                                    <label class="form-label" for="maxRetries">최대 재시도 횟수</label>
                                    <div class="input-group">
                                        <input type="number" id="maxRetries" class="form-input" value="3" min="1" max="10">
                                        <span class="input-unit">회</span>
                                    </div>
                                </div>
                                <div class="settings-field">
                                    <label class="form-label" for="timeout">요청 제한시간</label>
                                    <div class="input-group">
                                        <input type="number" id="timeout" class="form-input" value="30" min="10" max="300">
                                        <span class="input-unit">초</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="advanced-panel">
                            <h4>크롤링 이력</h4>
                            <div class="updates-timeline compact-timeline" id="updatesTimeline">
                                <!-- Timeline items will be dynamically generated -->
                            </div>
                            <div class="settings-row-actions">
                                <button class="btn btn-danger-outline btn-sm" id="clearHistoryBtn">
                                    전체 이력 삭제
                                </button>
                            </div>
                        </div>

                        <div class="advanced-panel">
                            <h4>터널 관리</h4>
                            <div class="settings-status-row">
                                <div class="settings-row-main">
                                    <div class="settings-row-copy">
                                        <div class="settings-row-title">ngrok Dev Domain</div>
                                        <div class="settings-row-status" id="ngrok-status">상태 확인 중...</div>
                                        <div class="site-url" id="ngrok-configured-url" hidden></div>
                                        <div class="site-url" id="ngrok-url" hidden></div>
                                    </div>
                                </div>
                                <div class="settings-row-actions">
                                    <button class="btn btn-sm btn-success" id="ngrok-start" hidden>시작</button>
                                    <button class="btn btn-sm btn-danger-outline" id="ngrok-stop" hidden>중지</button>
                                    <button class="btn btn-sm btn-outline" id="ngrok-copy" hidden>URL 복사</button>
                                    <button class="btn btn-sm btn-outline" id="ngrok-setup" onclick="location.href='./setup_ngrok.sh'">ngrok 설정</button>
                                </div>
                            </div>
                            <div class="settings-row-actions">
                                <button class="btn btn-primary btn-sm" id="refresh-tunnel-status">터널 상태 새로고침</button>
                            </div>
                        </div>
                    </div>
                </details>
            </section>
        </div>
    </main>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="/static/js/settings.js"></script>
</body>
</html>
