<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예규판례 모니터링 대시보드</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/dashboard.css?v=ux-direct-link-color-fix-20260623">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23667085'><path d='M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2'/></svg>">
</head>
<body class="dashboard-body">
    <!-- Header -->
    <header class="dashboard-header">
        <div class="container">
            <div class="header-content">
                <div class="header-left">
                    <div class="header-logo">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1>예규판례 모니터링</h1>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-actions" aria-label="운영 상태">
                        <div class="header-status" id="headerScheduleStatus">다음 --</div>
                        <div class="connection-indicator" id="connectionStatus">
                            <div class="indicator-dot"></div>
                            <span>연결 중</span>
                        </div>
                        <button class="icon-btn" id="settingsBtn" aria-label="설정" title="설정">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <div class="container">
            <section class="dashboard-toolbar" aria-labelledby="dashboardTitle">
                <h2 id="dashboardTitle">신규 데이터</h2>
                <div class="time-filter-controls">
                    <div class="filter-buttons" aria-label="조회 기간">
                        <button class="filter-btn active" data-hours="24">24시간</button>
                        <button class="filter-btn" data-hours="72">3일</button>
                        <button class="filter-btn" data-hours="168">7일</button>
                        <button class="filter-btn" data-range="custom">기간</button>
                    </div>
                    <div class="date-range-picker" id="dateRangePicker" hidden>
                        <input type="date" id="startDate" class="date-input" aria-label="시작일">
                        <span class="date-separator">~</span>
                        <input type="date" id="endDate" class="date-input" aria-label="종료일">
                        <button class="btn btn-primary btn-sm" id="applyDateRange">적용</button>
                    </div>
                </div>
            </section>

            <section class="panel source-overview" aria-labelledby="sourceOverviewTitle">
                <div class="source-overview-header">
                    <h3 id="sourceOverviewTitle">출처별 신규</h3>
                </div>
                <div class="source-filter-summary" id="sourceFilterSummary">
                    <div class="source-filter-empty">로딩 중</div>
                </div>
                <div class="source-filter-list source-grid" id="sourceFilterList">
                    <div class="source-filter-empty">로딩 중</div>
                </div>
            </section>

            <section class="panel recent-panel" aria-labelledby="recentItemsTitle">
                <div class="panel-header">
                    <h3 id="recentItemsTitle">신규 항목</h3>
                    <button class="text-btn" id="refreshDashboardBtn">새로고침</button>
                </div>
                <div class="table-wrap">
                    <table class="data-table recent-table">
                        <thead>
                            <tr>
                                <th>소스</th>
                                <th>세목/분류</th>
                                <th>유형/결론</th>
                                <th>제목</th>
                                <th>일자</th>
                                <th aria-label="작업"></th>
                            </tr>
                        </thead>
                        <tbody id="recentItemsTableBody">
                            <tr>
                                <td colspan="6" class="table-empty">로딩 중</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>


    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>로딩 중</p>
        </div>
    </div>

    <script src="/static/js/dashboard.js?v=ux-direct-link-color-fix-20260623"></script>
</body>
</html>
